<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo padrão</title>
    <link rel="stylesheet" href="./assets/css/index.css">
    <script src="assets/js/index.js" defer></script>
</head>
<body>
    <section class="container">
            <h1>Tabela IMC</h1>
            <h4>IMC Abaixo do peso</h4> 
            <form action="" id="form">
                <label for="input-peso">Peso</label>
                <input type="number" name="" id="input-peso">

                <label for="input-altura">Altura</label>
                <input type="number" name="" id="input-altura" step="any" min="0.30" max="3.0">
                <button>Enviar</button>
                <div id="imc"></div>
            </form>
    </section>
</body>
</html>
